<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Mosaico decorativo de la banda superior: iconos de línea dibujados para
       el proyecto (jeringa, gota, cápsula, glucómetro, estetoscopio, historia
       clínica y cruz). Trazos finos y translúcidos: es textura, no contenido. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <!-- Jeringa -->
    <g transform="translate(52 62) rotate(-40)" stroke="#E8C766" stroke-opacity="0.22">
      <rect x="-22" y="-7" width="40" height="14" rx="3"/>
      <path d="M-22 -11v22M-34 0h12M-38 -6v12M18 -3h8M26 0h16"/>
      <path d="M-12 -7v6M-4 -7v6M4 -7v6M12 -7v6"/>
    </g>
    <!-- Gota de sangre -->
    <path transform="translate(170 46)" stroke="#E8AF2E" stroke-opacity="0.26"
          d="M0 -20C9 -7 13 0 13 7A13 13 0 0 1 -13 7C-13 0 -9 -7 0 -20Z"/>
    <!-- Cápsula -->
    <g transform="translate(300 58) rotate(30)" stroke="#E8C766" stroke-opacity="0.2">
      <rect x="-24" y="-9" width="48" height="18" rx="9"/>
      <path d="M0 -9v18"/>
    </g>
    <!-- Glucómetro con tira -->
    <g transform="translate(385 150)" stroke="#8FB3EC" stroke-opacity="0.24">
      <rect x="-16" y="-22" width="32" height="44" rx="8"/>
      <rect x="-10" y="-15" width="20" height="14" rx="3"/>
      <path d="M-4 -22v-10h8v10"/>
      <circle cx="-5" cy="10" r="2.5"/><circle cx="5" cy="10" r="2.5"/>
    </g>
    <!-- Estetoscopio -->
    <g transform="translate(118 168)" stroke="#8FB3EC" stroke-opacity="0.22">
      <path d="M-18 -26v16a14 14 0 0 0 28 0v-16"/>
      <path d="M-4 4v14a16 16 0 0 0 32 0v-6"/>
      <circle cx="28" cy="6" r="6"/>
      <path d="M-22 -26h8M6 -26h8"/>
    </g>
    <!-- Historia clínica -->
    <g transform="translate(250 176)" stroke="#E8C766" stroke-opacity="0.2">
      <rect x="-18" y="-24" width="36" height="48" rx="5"/>
      <rect x="-8" y="-28" width="16" height="8" rx="3"/>
      <path d="M-10 -8l3 3 6 -6M4 -7h8M-10 6l3 3 6 -6M4 7h8M-10 18h22"/>
    </g>
    <!-- Cruces pequeñas -->
    <path transform="translate(330 232)" stroke="#E8AF2E" stroke-opacity="0.22" d="M0 -7v14M-7 0h14"/>
    <path transform="translate(24 222)" stroke="#8FB3EC" stroke-opacity="0.2" d="M0 -6v12M-6 0h12"/>
    <!-- Gota pequeña -->
    <path transform="translate(196 236) scale(0.6)" stroke="#E8C766" stroke-opacity="0.22"
          d="M0 -20C9 -7 13 0 13 7A13 13 0 0 1 -13 7C-13 0 -9 -7 0 -20Z"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
