<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img"
     aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Ilustración de material para el control de la diabetes</title>
  <desc id="d">Glucómetro con una gota en la pantalla, frasco de insulina, pluma de insulina,
    cápsulas y una historia clínica, en los colores del proyecto.</desc>
  <!-- Dibujo original del proyecto con la paleta de cinco colores.
       Formas planas y contornos suaves, sin texto de marca. -->
  <!-- Suelo -->
  <ellipse cx="220" cy="272" rx="200" ry="14" fill="#0E2043" opacity="0.35"/>

  <!-- Historia clínica, al fondo -->
  <g transform="translate(300 52) rotate(8)">
    <rect x="0" y="0" width="112" height="150" rx="12" fill="#223164"/>
    <rect x="8" y="10" width="96" height="132" rx="8" fill="#F1F4FA"/>
    <rect x="34" y="-8" width="44" height="20" rx="6" fill="#E8C766"/>
    <g stroke="#3462AC" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M22 44l7 7 12 -13"/><path d="M50 45h40"/>
      <path d="M22 78l7 7 12 -13"/><path d="M50 79h40"/>
      <path d="M50 113h40"/>
    </g>
    <rect x="22" y="104" width="18" height="18" rx="4" fill="none" stroke="#85A4D6" stroke-width="4"/>
  </g>

  <!-- Frasco de insulina -->
  <g transform="translate(40 120)">
    <rect x="14" y="0" width="52" height="18" rx="5" fill="#223164"/>
    <rect x="20" y="16" width="40" height="12" fill="#85A4D6"/>
    <rect x="0" y="26" width="80" height="120" rx="16" fill="#D6E0F2"/>
    <rect x="0" y="26" width="80" height="120" rx="16" fill="none" stroke="#B2C5E8" stroke-width="3"/>
    <rect x="8" y="64" width="64" height="48" rx="6" fill="#F1F4FA"/>
    <rect x="16" y="76" width="48" height="8" rx="4" fill="#3462AC"/>
    <rect x="16" y="92" width="32" height="6" rx="3" fill="#85A4D6"/>
    <rect x="12" y="36" width="10" height="24" rx="5" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Glucómetro -->
  <g transform="translate(150 70)">
    <rect x="44" y="-30" width="22" height="44" rx="4" fill="#E8C766"/>
    <rect x="49" y="-26" width="12" height="10" rx="2" fill="#E8AF2E"/>
    <rect x="0" y="0" width="110" height="180" rx="34" fill="#3462AC"/>
    <rect x="0" y="0" width="110" height="180" rx="34" fill="none" stroke="#223164" stroke-width="4"/>
    <rect x="16" y="24" width="78" height="70" rx="12" fill="#F1F4FA"/>
    <path d="M55 36C66 51 71 59 71 67A16 16 0 0 1 39 67C39 59 44 51 55 36Z" fill="#E8AF2E"/>
    <ellipse cx="49" cy="64" rx="4" ry="6" fill="#FFFFFF" opacity="0.7"/>
    <path d="M30 128l-12 14 12 14z" fill="#223164"/>
    <path d="M80 128l12 14 -12 14z" fill="#223164"/>
    <circle cx="55" cy="142" r="12" fill="#223164"/>
    <circle cx="55" cy="142" r="5" fill="#E8C766"/>
  </g>

  <!-- Pluma de insulina, tendida -->
  <g transform="translate(70 232) rotate(-6)">
    <rect x="0" y="0" width="250" height="26" rx="13" fill="#223164"/>
    <rect x="150" y="0" width="100" height="26" rx="13" fill="#3462AC"/>
    <rect x="96" y="6" width="44" height="14" rx="4" fill="#D6E0F2"/>
    <rect x="248" y="8" width="24" height="10" rx="3" fill="#85A4D6"/>
    <path d="M272 13h18" stroke="#B2C5E8" stroke-width="3" stroke-linecap="round"/>
    <rect x="-14" y="5" width="18" height="16" rx="4" fill="#E8C766"/>
  </g>

  <!-- Cápsulas -->
  <g transform="translate(330 232) rotate(-28)">
    <rect x="0" y="0" width="56" height="22" rx="11" fill="#E8AF2E"/>
    <path d="M28 0h17a11 11 0 0 1 0 22h-17z" fill="#F1F4FA"/>
  </g>
  <g transform="translate(382 246) rotate(14)">
    <rect x="0" y="0" width="46" height="18" rx="9" fill="#E8C766"/>
    <path d="M23 0h14a9 9 0 0 1 0 18h-14z" fill="#85A4D6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
