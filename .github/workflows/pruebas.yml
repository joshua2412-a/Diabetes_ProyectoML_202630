# Ejecuta las pruebas automáticas en cada push y pull request.
#
# Se excluyen las pruebas marcadas como "lento", que leen los datos reales
# completos y tardan varios minutos; esas se corren en local con
# `pytest -m lento`.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -m "not lento"
