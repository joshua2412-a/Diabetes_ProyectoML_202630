[pytest]
# Raíz del repositorio (para importar src) y docs (para comparar con el
# motor congelado del Entregable 2, docs/experimento.py).
pythonpath = . docs
testpaths = tests
addopts = -ra
markers =
    lento: pruebas con los datos reales completos (minutos). En integración continua se excluyen con -m "not lento".
# scikit-learn 1.8+ avisa en cada ajuste de la logística con penalty="l1"
# que el parámetro está obsoleto. El comportamiento no cambia y
# src/configuracion.py ya los filtra, pero pytest restablece los filtros en
# cada prueba: sin estas líneas, cada ejecución imprime cientos de avisos.
filterwarnings =
    ignore:'penalty' was deprecated:FutureWarning
    ignore:Inconsistent values.*penalty=.* with l1_ratio:UserWarning
